name: Game Shop QA

on:
  push:
    branches: [main, refactor-v3]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run API + Concurrency Tests
        run: pytest tests/api tests/concurrency -v --cov=backend --cov-report=xml --alluredir=./allure-results
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-api
          path: allure-results
          retention-days: 7

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: playwright install chromium --with-deps
      - name: Run UI Tests
        run: pytest tests/ui -v --alluredir=./allure-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-ui
          path: allure-results
          retention-days: 7

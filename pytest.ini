[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

addopts =
    -v
    --tb=short
    --strict-markers
    -W ignore::DeprecationWarning
    --reruns=1
    --reruns-delay=1
    --alluredir=./allure-results
    --clean-alluredir

markers =
    api: API 接口测试
    ui: UI 自动化测试
    concurrency: 并发/竞态测试
    e2e: 端到端测试
    slow: 慢速测试
    smoke: 冒烟测试
    boundary: 边界值测试
    shop: 商城相关测试

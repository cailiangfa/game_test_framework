[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
    --reruns=1
    --reruns-delay=1

markers =
    api: API接口测试
    ui: UI自动化测试
    concurrency: 并发/竞态测试
    e2e: 端到端测试
    slow: 慢用例